services:
  db:
    image: pgvector/pgvector:pg16
    container_name: idea-forge-db
    environment:
      POSTGRES_USER: idea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idea}
      POSTGRES_DB: idea_forge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea -d idea_forge"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
