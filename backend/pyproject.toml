[project]
name = "idea-forge-backend"
version = "0.1.0"
description = "Idea Forge backend: multi-agent business idea validation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "openai==3.31.0",
    "pgvector==0.5.1",
    "pydantic==2.14.1",
    "pydantic-ai-slim[openai]==2.56.0",
    "pydantic-settings==2.16.0",
    "sse-starlette==3.5.0",
    "sqlalchemy[asyncio]==2.1.4",
    "tenacity==9.2.1",
    "uvicorn[standard]==0.54.0",
    "weasyprint==70.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"migrations/**" = ["E501"]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
executionEnvironments = [{ root = "." }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "eval: live evals that hit real paid APIs (run with -m eval, costs money)",
    "integration: requires a real Postgres instance",
]
addopts = "-m 'not eval' -q"
